<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marathon Coach</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🏃 <span>Marathon Coach</span></div>
    <div class="countdown" id="countdown"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active">📊 <span>Tổng quan</span></button>
    <button data-tab="plan">📅 <span>Giáo án</span></button>
    <button data-tab="nutrition">🍚 <span>Dinh dưỡng</span></button>
    <button data-tab="data">❤️ <span>Chỉ số</span></button>
    <button data-tab="sync">⌚ <span>Garmin</span></button>
    <button data-tab="profile">⚙️ <span>Hồ sơ</span></button>
  </nav>

  <main>
    <section id="tab-dashboard" class="tab active"></section>
    <section id="tab-plan" class="tab"></section>
    <section id="tab-nutrition" class="tab"></section>
    <section id="tab-data" class="tab"></section>
    <section id="tab-sync" class="tab"></section>
    <section id="tab-profile" class="tab"></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="js/calc.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
